[project]
name = "tacclaw-wrapper"
version = "0.1.0"
description = "Safety-gated adapter for the DM TacClaw vendor SDK"
readme = "README.md"
requires-python = ">=3.8,<3.11"
dependencies = ["PyYAML>=6"]

[project.scripts]
tacclaw-gripper-smoke = "tacclaw_wrapper.cli:main"
tacclaw-camera-smoke = "tacclaw_wrapper.camera_cli:main"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[tool.setuptools.package-data]
"tacclaw_wrapper.data" = ["*.yaml"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py38"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I"]
